<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="560" fill="#ffffff"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#3a3a3a">Ventral (bottom-up) view, simplified</text>

  <!-- Brain outline, ventral view: frontal poles at top, occipital lobes and cerebellum at bottom -->
  <path d="M 300 65
           C 250 65, 195 78, 172 105
           C 150 130, 140 165, 135 200
           C 130 240, 112 260, 108 290
           C 104 320, 118 345, 145 360
           C 138 385, 148 405, 172 415
           C 168 430, 182 445, 205 448
           C 215 465, 240 478, 265 475
           C 275 488, 300 492, 300 492
           C 300 492, 325 488, 335 475
           C 360 478, 385 465, 395 448
           C 418 445, 432 430, 428 415
           C 452 405, 462 385, 455 360
           C 482 345, 496 320, 492 290
           C 488 260, 470 240, 465 200
           C 460 165, 450 130, 428 105
           C 405 78, 350 65, 300 65 Z"
        fill="#f2e9e4" stroke="#7a6a5f" stroke-width="3"/>

  <!-- Longitudinal fissure, separating left and right hemispheres -->
  <line x1="300" y1="75" x2="300" y2="485" stroke="#b3a294" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Left and right temporal lobe boundary (Sylvian fissure, simplified) -->
  <path d="M 150 190 C 190 210, 230 220, 262 218" fill="none" stroke="#b3a294" stroke-width="1.5"/>
  <path d="M 450 190 C 410 210, 370 220, 338 218" fill="none" stroke="#b3a294" stroke-width="1.5"/>

  <!-- Fusiform gyrus / FFA, bilateral, medial-posterior part of each temporal lobe -->
  <ellipse cx="248" cy="315" rx="20" ry="52" fill="#d98e73" opacity="0.85" transform="rotate(-8 248 315)"/>
  <ellipse cx="248" cy="315" rx="20" ry="52" fill="none" stroke="#a8442a" stroke-width="2" transform="rotate(-8 248 315)"/>

  <ellipse cx="352" cy="315" rx="20" ry="52" fill="#d98e73" opacity="0.85" transform="rotate(8 352 315)"/>
  <ellipse cx="352" cy="315" rx="20" ry="52" fill="none" stroke="#a8442a" stroke-width="2" transform="rotate(8 352 315)"/>

  <!-- Label -->
  <line x1="248" y1="315" x2="248" y2="500" stroke="#a8442a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="522" text-anchor="middle" font-size="16" fill="#3a3a3a" font-weight="600">Fusiform Face Area (FFA)</text>
  <text x="300" y="542" text-anchor="middle" font-size="12" fill="#6a6a6a">fusiform gyrus, medial temporal lobe (bilateral)</text>
</svg>
